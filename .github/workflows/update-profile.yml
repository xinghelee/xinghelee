name: Update profile

on:
  schedule:
    # UTC 16:00 = 北京时间次日 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render terminal SVG
        env:
          # 默认用 Actions 的内置 token。它取不到贡献日历时（GraphQL 对
          # contributionsCollection 的权限偶尔会变），在仓库里加一个
          # PROFILE_TOKEN secret（classic PAT，read:user 即可）顶上。
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/render.py

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          # 没有实际变化就不要推空提交，免得把贡献图刷成一片假的绿
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: 刷新终端主页"
            git push
          fi
