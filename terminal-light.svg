<text x="450.0" y="23.5" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">xinghelee — zsh</text>
<text x="26" y="64" class="mono"><tspan fill="#1a7f37">~ $ </tspan><tspan fill="#0550ae">brew tap xinghelee/tap</tspan></text><text x="26" y="87" class="mono"><tspan fill="#1a7f37">~ $ </tspan><tspan fill="#0550ae">brew install --cask termite berth</tspan></text><text x="26" y="110" class="mono"><tspan fill="#8b949e">==&gt; </tspan><tspan fill="#1a7f37" font-weight="600">Termite</tspan><tspan fill="#9a6700">  2.0.1</tspan><tspan fill="#1f2328">   Native terminal with session persistence and deep shell integration</tspan></text><text x="26" y="133" class="mono"><tspan fill="#8b949e">==&gt; </tspan><tspan fill="#1a7f37" font-weight="600">Berth  </tspan><tspan fill="#9a6700">  1.8.6</tspan><tspan fill="#1f2328">   Native SSH client with jump hosts, port forwarding and iCloud sync</tspan></text><text x="26" y="156" class="mono"><tspan fill="#1a7f37">~ $ </tspan></text><rect x="59.6" y="143.5" width="8.4" height="15.5" fill="#1a7f37" opacity="1"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.5;0.501;1" dur="1.1s" begin="0s" repeatCount="indefinite"/></rect>
